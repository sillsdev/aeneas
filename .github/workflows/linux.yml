name: PyInstaller Linux one dir release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  pyinstaller-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout app-builders-pyinstaller
        uses: actions/checkout@v5

      - name: Set VERSION file from tag
        if: github.ref_type == 'tag'
        run: echo "${{ github.ref_name }}" | sed 's/^v//' > VERSION

      - name: Install dependencies and create one dir executable
        run: |
          echo "Install OS dependencies"
          sudo apt update
          sudo apt install espeak libespeak-dev espeak-data libespeak1 python3-dev
          echo "Creating Python Virtual environment..."
          python3 -m venv .venv
          source .venv/bin/activate
          echo "Install Python requirements... "
          pip install -r requirements.txt
          echo "Build Aeneas C extensions... "
          python setup.py build_ext --inplace

          echo "Create PyInstaller one directory executable"
          pyinstaller pyinstaller-onedir.spec --clean

          cp VERSION dist/aeneas-cli/VERSION

      - name: Create tar.gz archive
        run: tar -czf aeneas-cli.linux.tar.gz -C dist/aeneas-cli .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aeneas-cli.linux.tar.gz
          path: aeneas-cli.linux.tar.gz

      - name: Release
        uses: softprops/action-gh-release@v2.6.1
        if: github.ref_type == 'tag'
        with:
          files: aeneas-cli.linux.tar.gz
