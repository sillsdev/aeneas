name: PyInstaller Mac one dir release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  pyinstaller-build:
    runs-on: macos-latest
    steps:
      - name: Set VERSION file from tag
        if: github.ref_type == 'tag'
        run: echo "${{ github.ref_name }}" | sed 's/^v//' > VERSION
      - name: Checkout app-builders-pyinstaller
        uses: actions/checkout@v5

      - name: Install dependencies and create one dir executable
        run: |
          echo "Install OS dependencies"
          brew update && brew install espeak-ng 
          echo "Creating Python virtual environment... "
          python3.14 -m venv .venv 
          source .venv/bin/activate 
          echo "Install Python requirements... "
          pip install -r requirements.txt
          echo "Build Aeneas C extensions... "
          export LIBRARY_PATH="$LIBRARY_PATH:$(brew --prefix)/lib"
          python setup.py build_ext --inplace 

          echo "Create Pyinstaller one directory executable"
          pyinstaller pyinstaller-onedir-macos.spec --clean

          echo "Copy espeak-ng files to aeneas-cli root"
          BREW_PREFIX="$(brew --prefix)"
          cp -RL "$BREW_PREFIX/share/espeak-ng-data" dist/aeneas-cli/
          cp -L "$BREW_PREFIX/bin/espeak-ng" dist/aeneas-cli/
          cp -L "$BREW_PREFIX/lib"/libespeak-ng* dist/aeneas-cli/

      - name: Zip build output
        run: cd dist/aeneas-cli && zip -r ../../aeneas-cli.mac.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aeneas-cli.mac.zip
          path: aeneas-cli.mac.zip

      - name: Release
        uses: softprops/action-gh-release@v2.6.1
        if: github.ref_type == 'tag'
        with:
          files: aeneas-cli.mac.zip
